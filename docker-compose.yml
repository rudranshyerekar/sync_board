version: '3.8'

services:
  backend:
    build:
      context: ./syncboard-backend
      dockerfile: Dockerfile
    container_name: syncboard-backend
    ports:
      - "8080:8080"
    environment:
      # Connects to MySQL running locally on the host system via host.docker.internal (standard for Mac/Win Docker Desktop)
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/syncboard?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - syncboard-network

  frontend:
    build:
      context: ./syncboard-frontend
      dockerfile: Dockerfile
    container_name: syncboard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - syncboard-network

# Optional standalone containerized MySQL database (if you prefer running DB in Docker instead of local Windows service):
#  mysql:
#    image: mysql:8.0
#    container_name: syncboard-db
#    environment:
#      MYSQL_DATABASE: syncboard
#      MYSQL_ROOT_PASSWORD: root
#    ports:
#      - "3307:3306"
#    volumes:
#      - syncboard_mysql_data:/var/lib/mysql
#    networks:
#      - syncboard-network

networks:
  syncboard-network:
    driver: bridge

